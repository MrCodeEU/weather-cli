[package]
name = "rust-viuer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
viuer = "0.9"
rust-shared = { path = "../rust-shared" }
